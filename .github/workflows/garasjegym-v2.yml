name: GarasjeGym 2.0 checks

on:
  push:
    branches:
      - "garasjegym-2.0-sturm­kopf"
    paths:
      - "v2/**"
      - ".github/workflows/garasjegym-v2.yml"
  pull_request:
    paths:
      - "v2/**"
      - ".github/workflows/garasjegym-v2.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: v2
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Check SQL migration delimiters
        run: npm run check:migrations
      - name: Run automated tests
        run: npm test
      - name: Build isolated TEST bundle
        env:
          VITE_SUPABASE_URL: https://izwzwvlexqxqewzijhhd.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_jZyaYhD8_jZgpgutKF7lRg_EcJ0EGSQ
        run: npm run build
      - name: Check built release artifact environment and secrets
        working-directory: v2
        env:
          EXPECTED_SUPABASE_PROJECT_REF: izwzwvlexqxqewzijhhd
        run: npm run check:release-artifact

  wave1-candidate-postgres17:
    if: github.event_name == 'push'
    name: Disposable PostgreSQL 17 Wave 1 Membership/Auth candidate rehearsal
    runs-on: ubuntu-latest
    timeout-minutes: 8
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: sturmkopf
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d sturmkopf"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client
      - name: Create disposable production-shaped fixture
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/sturmkopf
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f v2/supabase/preflight/wave1_candidate_postgres17_fixture.sql
      - name: Apply Wave 1 candidate and run authorization assertions
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/sturmkopf
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f v2/supabase/preflight/wave1_candidate_postgres17_run.sql

  owner-first-signup-postgres17:
    if: github.event_name == 'push'
    name: Disposable PostgreSQL 17 first-owner signup security rehearsal
    runs-on: ubuntu-latest
    timeout-minutes: 8
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: sturmkopf
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d sturmkopf"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client
      - name: Create isolated Auth/profile fixture
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/sturmkopf
        run: psql "$DATABASE_URL" -X -v ON_ERROR_STOP=1 -f v2/supabase/preflight/owner_first_signup_postgres17_fixture.sql
      - name: Assert first owner confirmation and reject competing registrations
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/sturmkopf
        run: psql "$DATABASE_URL" -X -v ON_ERROR_STOP=1 -f v2/supabase/preflight/owner_first_signup_postgres17_assertions.sql

  trigger-functions-postgres17:
    if: github.event_name == 'push'
    name: Disposable PostgreSQL 17 trigger-function privilege rehearsal
    runs-on: ubuntu-latest
    timeout-minutes: 8
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: sturmkopf
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d sturmkopf"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client
      - name: Create trigger-only function fixture
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/sturmkopf
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f v2/supabase/preflight/trigger_execute_postgres17_fixture.sql
      - name: Revoke direct client execution from attached trigger functions
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/sturmkopf
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f v2/supabase/migrations/20261121000100_revoke_public_execute_from_trigger_functions.sql
      - name: Assert direct calls are blocked and triggers still execute
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/sturmkopf
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f v2/supabase/preflight/trigger_execute_postgres17_assertions.sql

  full-supabase-migration-replay:
    if: github.event_name == 'push'
    name: Clean local Supabase PostgreSQL 17 full migration replay
    # Serialize full local Supabase stacks; they otherwise contend for host ports.
    concurrency:
      group: sturmkopf-full-supabase-replay-${{ github.ref }}
      # Queue subsequent pushes instead of cancelling an in-flight database replay.
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 3.2.0
      - name: Initialize ephemeral local Supabase configuration
        working-directory: v2
        run: |
          if [ ! -f supabase/config.toml ]; then
            supabase init
          fi
          if grep -q '^major_version = ' supabase/config.toml; then
            sed -i 's/^major_version = .*/major_version = 17/' supabase/config.toml
          else
            printf '\n[db]\nmajor_version = 17\n' >> supabase/config.toml
          fi
          # Use a dedicated port range to avoid collisions with other CI jobs.
          python3 - <<'PY'
          import re
          from pathlib import Path
          path = Path("supabase/config.toml")
          text = path.read_text()
          port_map = {
              "api": {"port": "55421"},
              "db": {"port": "55422", "shadow_port": "55420"},
              "studio": {"port": "55423"},
              "inbucket": {"port": "55424"},
              "analytics": {"port": "55427"},
              "db.pooler": {"port": "55429"},
          }
          for section, values in port_map.items():
              pattern = re.compile(rf"(?ms)(^\[{re.escape(section)}\]\s*\n)(.*?)(?=^\[|\Z)")
              match = pattern.search(text)
              if not match:
                  continue
              body = match.group(2)
              for key, value in values.items():
                  line = re.compile(rf"(?m)^\s*{re.escape(key)}\s*=.*$")
                  body, count = line.subn(f"{key} = {value}", body, count=1)
                  if count == 0:
                      body += f"\n{key} = {value}\n"
              text = text[:match.start(2)] + body + text[match.end(2):]
          path.write_text(text)
          PY
      - name: Install isolated TEST-only baseline and fixtures
        working-directory: v2
        run: |
          # These files are intentionally outside the production migration path.
          # Copy them only into this disposable local test stack.
          cp supabase/test-fixtures/migrations/*.sql supabase/migrations/
      - name: Start isolated Supabase stack
        working-directory: v2
        timeout-minutes: 12
        # Keep Postgres, Auth, API, Storage and Realtime for contract tests.
        # Studio, email-inbox UI and image proxy are not needed for this replay.
        run: supabase start --exclude studio,inbucket,imgproxy
      - name: Replay the complete versioned migration chain from an empty database
        working-directory: v2
        run: supabase db reset
      - name: Install PostgreSQL client for local contract checks
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client
      - name: Verify exact reconciled exercise catalogue
        env:
          DATABASE_URL: postgres://postgres:postgres@127.0.0.1:55422/postgres
        run: psql "$DATABASE_URL" -X -v ON_ERROR_STOP=1 -f v2/supabase/preflight/exercise_catalogue_manifest_assertions.sql
      - name: Verify full schema, RPC grants and privacy policies on local Supabase
        env:
          DATABASE_URL: postgres://postgres:postgres@127.0.0.1:55422/postgres
        run: |
          result="$(psql "$DATABASE_URL" -X -v ON_ERROR_STOP=1 -At -F '|' -f v2/supabase/preflight/full_supabase_postgres17_contract_assertions.sql)"
          printf '%s\\n' "$result"
          expected='t|t|t|t|t|t|t|t|t|t|t|t'
          test "$result" = "$expected"
      - name: Verify release Auth and RLS security contract
        env:
          DATABASE_URL: postgres://postgres:postgres@127.0.0.1:55422/postgres
        run: |
          psql "$DATABASE_URL" -X -v ON_ERROR_STOP=1 -At -F '|' -f v2/supabase/preflight/release_security_contract_assertions.sql | tee /tmp/release-security-contract.out
          test "$(tail -n 1 /tmp/release-security-contract.out)" = "t"
      - name: Reject unreviewed privileged RPC exposure
        env:
          DATABASE_URL: postgres://postgres:postgres@127.0.0.1:55422/postgres
        run: |
          result="$(psql "$DATABASE_URL" -X -v ON_ERROR_STOP=1 -At -F '|' -f v2/supabase/preflight/public_definer_rpc_contract_read_only.sql)"
          printf 'Privileged RPC release contract: %s\n' "$result"
          test "$result" = 't|t|t|t|t|t'
      - name: Verify real Auth signup trigger and pending member gate
        env:
          DATABASE_URL: postgres://postgres:postgres@127.0.0.1:55422/postgres
        run: psql "$DATABASE_URL" -X -v ON_ERROR_STOP=1 -f v2/supabase/preflight/auth_signup_gate_full_supabase_postgres17.sql
      - name: Rehearse complete clean-start reset and new owner admin in rollback transaction
        env:
          DATABASE_URL: postgres://postgres:postgres@127.0.0.1:55422/postgres
        run: psql "$DATABASE_URL" -X -v ON_ERROR_STOP=1 -f v2/supabase/preflight/owner_admin_bootstrap_smoke_test.sql
      - name: Execute read-only clean-start preflight SQL on isolated replay
        env:
          DATABASE_URL: postgres://postgres:postgres@127.0.0.1:55422/postgres
        run: |
          psql "$DATABASE_URL" -X -v ON_ERROR_STOP=1 -f v2/supabase/preflight/clean_start_readiness_read_only.sql > /tmp/clean-start-readiness.out
          test -s /tmp/clean-start-readiness.out
          printf 'Read-only pre-reset inventory rows: '
          wc -l < /tmp/clean-start-readiness.out
          printf 'Post-reset acceptance is executed inside the full rollback clean-start rehearsal above.'
      - name: Rehearse owner-only first registration trigger in rollback transaction
        env:
          DATABASE_URL: postgres://postgres:postgres@127.0.0.1:55422/postgres
        run: psql "$DATABASE_URL" -X -v ON_ERROR_STOP=1 -f v2/supabase/preflight/owner_first_signup_bootstrap_ci.sql
      - name: Export reviewed target application schemas and grants without rows or secrets
        run: |
          mkdir -p release-schema
          # Run pg_dump from the actual PostgreSQL 17 container so the client
          # major version always matches the test database server.
          mapfile -t db_containers < <(docker ps --filter 'name=supabase_db_' --format '{{.Names}}')
          test "${#db_containers[@]}" -eq 1
          docker exec "${db_containers[0]}" pg_dump -U postgres -d postgres --schema-only --schema=public --schema=app_private --no-owner > release-schema/sturmkopf-target-application-schema.sql
          test -s release-schema/sturmkopf-target-application-schema.sql
          if grep -Eq '^(COPY|INSERT INTO|\\connect)' release-schema/sturmkopf-target-application-schema.sql; then
            echo 'Unexpected data or connection command in schema-only export' >&2
            exit 1
          fi
      - name: Archive schema-only comparison input
        uses: actions/upload-artifact@v4
        with:
          name: sturmkopf-reviewed-target-application-schema-only
          path: release-schema/sturmkopf-target-application-schema.sql
          if-no-files-found: error
          retention-days: 7
      - name: Stop ephemeral Supabase stack
        if: always()
        working-directory: v2
        run: supabase stop --no-backup
