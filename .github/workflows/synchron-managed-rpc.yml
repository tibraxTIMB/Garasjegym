name: SYNCHRON managed RPC isolated contract
on:
  push:
    branches: [fix/synchron-managed-rpc-20261127]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  rehearsal:
    if: github.ref == 'refs/heads/fix/synchron-managed-rpc-20261127'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: fixture-only
          POSTGRES_DB: gg_synchron_fixture
        ports:
          - 5432:5432
        options: --health-cmd "pg_isready -U postgres -d gg_synchron_fixture" --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Load synthetic database and restricted bridge
        env:
          PGPASSWORD: fixture-only
        run: |
          psql -X -h 127.0.0.1 -U postgres -d gg_synchron_fixture -v ON_ERROR_STOP=1 -c 'CREATE ROLE service_role NOLOGIN BYPASSRLS;'
          psql -X -h 127.0.0.1 -U postgres -d gg_synchron_fixture -v ON_ERROR_STOP=1 -f v2/supabase/preflight/synchron_pg_fixture.sql -f v2/supabase/preflight/synchron_pg_candidate.sql -f v2/supabase/preflight/synchron_pg_result_candidate.sql -f v2/supabase/preflight/synchron_pg_notification_candidate.sql -f v2/supabase/preflight/synchron_pg_role_candidate.sql -f v2/supabase/preflight/synchron_pg_auth_candidate.sql -f v2/supabase/preflight/synchron_pg_login_fixture.sql -f v2/supabase/preflight/synchron_pg_managed_rpc_candidate.sql
      - name: Rehearse actual private bridge, authorization, HTTP, CAS and result receipts
        run: node v2/scripts/synchron-postgres-rehearsal.mjs --managed
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.5.6
      - name: Verify managed Edge module and frozen lock
        run: deno cache --no-config --lock=v2/server/edge-candidate/deno.lock --frozen v2/server/edge-candidate/managed.ts
