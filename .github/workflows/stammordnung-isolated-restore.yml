name: STAMMORDNUNG isolated installed-schema and synthetic restore
on:
  push:
    branches: ['ops/stammordnung-ordre006-rehearsal']
    paths:
      - 'v2/supabase/preflight/ordnung006*'
      - '.github/workflows/stammordnung-isolated-restore.yml'
permissions:
  contents: read
jobs:
  rehearsal:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: fixture-only
          POSTGRES_DB: ordre006
        ports:
          - 5432:5432
        options: --health-cmd "pg_isready -U postgres -d ordre006" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      PGPASSWORD: fixture-only
    steps:
      - uses: actions/checkout@v4
      - name: Installed schema excerpt against disposable fixture
        run: |
          psql -h localhost -U postgres -d ordre006 -v ON_ERROR_STOP=1 \
            -f v2/supabase/preflight/ordnung006_fixture.sql \
            -f v2/supabase/preflight/ordnung006_installed_schema_rehearsal.sql \
            -f v2/supabase/preflight/ordnung006_assertions.sql \
            -f v2/supabase/preflight/ordnung006_installed_extra_assertions.sql
      - name: Synthetic custom-format dump and real isolated restore
        run: |
          docker exec "${{ job.services.postgres.id }}" pg_dump -U postgres -Fc -d ordre006 -f /tmp/fixture.pgbackup
          docker exec "${{ job.services.postgres.id }}" pg_restore --list /tmp/fixture.pgbackup >/dev/null
          docker exec "${{ job.services.postgres.id }}" createdb -U postgres ordre006_restored
          docker exec "${{ job.services.postgres.id }}" pg_restore -U postgres --exit-on-error -d ordre006_restored /tmp/fixture.pgbackup
          for db in ordre006 ordre006_restored; do
            psql -h localhost -U postgres -d "$db" -v ON_ERROR_STOP=1 -At -c "select md5(string_agg(row_to_json(t)::text,',' order by equipment_key)) from public.garage_equipment_inventory t; select count(*) from public.workout_logs; select count(*) from public.pt_wod_assignments; select count(*) from pg_policies where tablename='garage_equipment_inventory'; select count(*) from public.profiles;" > "/tmp/$db.counts"
          done
          diff -u /tmp/ordre006.counts /tmp/ordre006_restored.counts
          psql -h localhost -U postgres -d ordre006_restored -v ON_ERROR_STOP=1 -c "set role authenticated; select set_config('request.jwt.claim.sub','00000000-0000-0000-0000-000000000002',false); do \$\$begin if public.get_pt_wod_result('30000000-0000-0000-0000-000000000001',null)->'result_data'->>'participation_verified' is distinct from 'individual' then raise exception 'restored result access'; end if; end\$\$;"
          echo "SYNTHETIC RESTORE VERIFIED — NOT A PRODUCTION BACKUP"
