name: GarasjeGym · Production release

on:
  push:
    branches:
      - "garasjegym-2.0-sturm­kopf"
    paths:
      - "v2/**"
      - ".github/workflows/deploy-sturmkopf-pages.yml"
      - ".github/production-release.json"
  workflow_dispatch:
    inputs:
      publish_production:
        description: "Publiser til eksisterande produksjonsadresse (ingen flytting av data eller app)"
        required: true
        type: boolean
        default: false

permissions:
  contents: read
  issues: write

concurrency:
  group: sturm­kopf-pages
  cancel-in-progress: true

jobs:
  build:
    if: ${{ github.ref == 'refs/heads/garasjegym-2.0-sturm­kopf' }}
    outputs:
      release_approved: ${{ steps.release_gate.outputs.approved }}
    # Playwright's pinned Chromium build supports 24.04, not the rolling 26.04 runner.
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify explicit release order
        id: release_gate
        if: ${{ github.event_name == 'push' }}
        run: node v2/scripts/check-release-order.mjs
      - name: Report build run to release issue
        if: ${{ github.event_name == 'push' }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/2/comments" \
            -f "body=Gazelle 1.2 build status and logs: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID} (commit ${GITHUB_SHA})" || true
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        working-directory: v2
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Install audio rendering dependency
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi
          ffmpeg -version
      - name: Render optional generative audio pack
        working-directory: ${{ github.workspace }}
        run: |
          python3 -m venv "$RUNNER_TEMP/gg-audio-venv"
          "$RUNNER_TEMP/gg-audio-venv/bin/python" -m pip install --disable-pip-version-check numpy==2.3.5 scipy==1.17.0
          "$RUNNER_TEMP/gg-audio-venv/bin/python" v2/scripts/render-generative-audio.py
      - name: Prepare free browser recording tools
        # Normal pushes use committed help videos; approved manual releases regenerate them.
        if: ${{ github.event_name == 'workflow_dispatch' }}
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Chromium for real GarasjeGym walkthroughs
        # Normal pushes use committed help videos; approved manual releases regenerate them.
        if: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          python -m pip install 'playwright==1.56.0' 'piper-tts==1.8.0'
          python -m playwright install --with-deps chromium
          sudo apt-get install -y ffmpeg
      - name: Cache free Norwegian narration model
        # Normal pushes use committed help videos; approved manual releases regenerate them.
        if: ${{ github.event_name == 'workflow_dispatch' }}
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/piper-voices
          key: norwegian-narration-talesyntese-v1-2026-11
      - name: Prepare offline Norwegian narration
        # Normal pushes use committed help videos; approved manual releases regenerate them.
        if: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          if [ ! -s "${RUNNER_TEMP}/piper-voices/no_NO-talesyntese-medium.onnx" ]; then
            python -m piper.download_voices --data-dir "${RUNNER_TEMP}/piper-voices" no_NO-talesyntese-medium
          fi
      - name: Auto-record actual app components with local demo data
        # Normal pushes use committed help videos; approved manual releases regenerate them.
        if: ${{ github.event_name == 'workflow_dispatch' }}
        working-directory: v2
        env:
          HELP_VIDEO_VOICE_MODEL: ${{ runner.temp }}/piper-voices/no_NO-talesyntese-medium.onnx
        run: npm run help:videos:live
      - name: Verify generated help videos
        # Normal pushes use committed help videos; approved manual releases regenerate them.
        if: ${{ github.event_name == 'workflow_dispatch' }}
        working-directory: v2
        run: npm run help:videos:live-check
      - name: Prepare release browser verification
        if: ${{ steps.release_gate.outputs.approved == 'true' || (github.event_name == 'workflow_dispatch' && inputs.publish_production == true) }}
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install release browser
        if: ${{ steps.release_gate.outputs.approved == 'true' || (github.event_name == 'workflow_dispatch' && inputs.publish_production == true) }}
        run: |
          python -m pip install 'playwright==1.56.0'
          python -m playwright install --with-deps chromium
      - name: Run full release responsive browser audit with isolated demo data
        if: ${{ steps.release_gate.outputs.approved == 'true' || (github.event_name == 'workflow_dispatch' && inputs.publish_production == true) }}
        working-directory: v2
        run: |
          npm run help:demo > /tmp/gg-ui-audit-vite.log 2>&1 &
          PID=$!
          trap 'kill "$PID" || true' EXIT
          for i in $(seq 1 60); do curl -fs http://127.0.0.1:4173/ui-audit.html >/dev/null && break; sleep 1; done
          python scripts/responsive-audit.py
      - name: Verify application and owner bootstrap
        working-directory: v2
        run: npm test
      - name: Build mobile web app
        working-directory: v2
        env:
          VITE_SUPABASE_URL: https://izwzwvlexqxqewzijhhd.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_jZyaYhD8_jZgpgutKF7lRg_EcJ0EGSQ
          VITE_OWNER_BOOTSTRAP_SIGNUP: 'false'
          VITE_HELP_VIDEO_REV: ${{ github.sha }}
          VITE_SPOTIFY_CLIENT_ID: ${{ vars.VITE_SPOTIFY_CLIENT_ID }}
        run: npm run build
      - name: Record build identity
        working-directory: v2
        run: node -e 'require("node:fs").writeFileSync("dist/release-info.json",JSON.stringify({commit:process.env.GITHUB_SHA,run_id:process.env.GITHUB_RUN_ID})+"\\n")'
      - name: Check built release artifact environment and secrets
        working-directory: v2
        env:
          EXPECTED_SUPABASE_PROJECT_REF: izwzwvlexqxqewzijhhd
        run: npm run check:release-artifact
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: v2/dist

  deploy:
    # Only an explicit verified order or deliberate manual approval; never ordinary pushes.
    if: ${{ (github.event_name == 'workflow_dispatch' && inputs.publish_production == true && github.ref == 'refs/heads/garasjegym-2.0-sturm­kopf') || (github.event_name == 'push' && needs.build.outputs.release_approved == 'true' && github.ref == 'refs/heads/garasjegym-2.0-sturm­kopf') }}
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Enable GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
