name: Deploy STURMKOPF production

on:
  push:
    branches:
      - "garasjegym-2.0-sturm­kopf"
    paths:
      - "v2/**"
      - ".github/workflows/deploy-sturmkopf-pages.yml"
  workflow_dispatch:
    inputs:
      publish_preview:
        description: "Publiser til den delte GitHub Pages-adressa (erstattar innhaldet som ligg der no)"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: sturm­kopf-pages
  cancel-in-progress: true

jobs:
  build:
    # Playwright's pinned Chromium build supports 24.04, not the rolling 26.04 runner.
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        working-directory: v2
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Prepare free browser recording tools
        # Normal pushes use committed help videos; approved manual releases regenerate them.
        if: ${{ github.event_name == 'workflow_dispatch' }}
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Chromium for real GarasjeGym walkthroughs
        # Normal pushes use committed help videos; approved manual releases regenerate them.
        if: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          python -m pip install 'playwright==1.56.0' 'piper-tts==1.8.0'
          python -m playwright install --with-deps chromium
          sudo apt-get install -y ffmpeg
      - name: Cache free Norwegian narration model
        # Normal pushes use committed help videos; approved manual releases regenerate them.
        if: ${{ github.event_name == 'workflow_dispatch' }}
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/piper-voices
          key: norwegian-narration-talesyntese-v1-2026-11
      - name: Prepare offline Norwegian narration
        # Normal pushes use committed help videos; approved manual releases regenerate them.
        if: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          if [ ! -s "${RUNNER_TEMP}/piper-voices/no_NO-talesyntese-medium.onnx" ]; then
            python -m piper.download_voices --data-dir "${RUNNER_TEMP}/piper-voices" no_NO-talesyntese-medium
          fi
      - name: Auto-record actual app components with local demo data
        # Normal pushes use committed help videos; approved manual releases regenerate them.
        if: ${{ github.event_name == 'workflow_dispatch' }}
        working-directory: v2
        env:
          HELP_VIDEO_VOICE_MODEL: ${{ runner.temp }}/piper-voices/no_NO-talesyntese-medium.onnx
        run: npm run help:videos:live
      - name: Verify generated help videos
        # Normal pushes use committed help videos; approved manual releases regenerate them.
        if: ${{ github.event_name == 'workflow_dispatch' }}
        working-directory: v2
        run: npm run help:videos:live-check
      - name: Verify application and owner bootstrap
        working-directory: v2
        run: npm test
      - name: Build mobile web app
        working-directory: v2
        env:
          VITE_SUPABASE_URL: https://izwzwvlexqxqewzijhhd.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_jZyaYhD8_jZgpgutKF7lRg_EcJ0EGSQ
          VITE_OWNER_BOOTSTRAP_SIGNUP: 'false'
          VITE_HELP_VIDEO_REV: ${{ github.sha }}
          VITE_SPOTIFY_CLIENT_ID: ${{ vars.VITE_SPOTIFY_CLIENT_ID }}
        run: npm run build
      - name: Check built release artifact environment and secrets
        working-directory: v2
        run: npm run check:release-artifact
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: v2/dist

  deploy:
    # GG-030: ordinary pushes run the build and tests only.
    # A production deploy requires an explicitly approved manual workflow_dispatch.
    # GG-030: ordinary pushes build and test. Production publication requires
    # explicit owner approval through manual workflow_dispatch.
    # GG-030: ordinary pushes build and test only. Production release requires
    # explicit owner approval via manual workflow_dispatch with publish_preview=true.
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_preview }}
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Enable GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
