name: Ordre 006 isolated PostgreSQL rehearsal
on:
  push:
    branches: [gazelle-operational-anatomical]
    paths:
      - 'v2/supabase/preflight/ordnung006*'
      - '.github/workflows/gazelle-ordre006-sql.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  rehearsal:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: fixture-only
          POSTGRES_DB: ordre006
        ports:
          - 5432:5432
        options: --health-cmd "pg_isready -U postgres -d ordre006" --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Apply candidates to disposable fixture and test roles
        env:
          PGPASSWORD: fixture-only
        run: |
          psql -h localhost -U postgres -d ordre006 -v ON_ERROR_STOP=1 \
            -f v2/supabase/preflight/ordnung006_fixture.sql \
            -f v2/supabase/preflight/ordnung006_shared_inventory_candidate.sql \
            -f v2/supabase/preflight/ordnung006_pt_result_provenance_candidate.sql \
            -f v2/supabase/preflight/ordnung006_assignment_schedule_candidate.sql \
            -f v2/supabase/preflight/ordnung006_assertions.sql
