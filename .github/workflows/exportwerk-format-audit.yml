name: EXPORTWERK native format audit
on:
  push:
    branches: [exportwerk-fertigstellung]
    paths: ['v2/src/lib/exportwerk*','v2/src/components/Exportwerk.jsx','v2/scripts/exportwerk*','.github/workflows/exportwerk-format-audit.yml']
permissions:
  contents: read
jobs:
  formats:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Inspect pinned official Garmin SDK registry metadata
        run: npm view @garmin/fitsdk@21.217.0 dist dependencies --json
      - run: node --test v2/scripts/exportwerk.test.mjs
      - run: node v2/scripts/exportwerk-xlsx-fixture.mjs
      - run: pip install openpyxl==3.1.5 && python v2/scripts/exportwerk-xlsx-check.py
