name: Audio Studio - musical ending laboratory
on:
  push:
    branches: [audio-studio-ki-probe]
    paths: ['.github/workflows/audio-ending-lab.yml','v2/audio-source/ending_lab.py']
permissions:
  contents: read
concurrency:
  group: audio-ending-lab
  cancel-in-progress: true
jobs:
  review-candidates:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      HF_HUB_DISABLE_IMPLICIT_TOKEN: '1'
      HF_HUB_DISABLE_TELEMETRY: '1'
      OMP_NUM_THREADS: '4'
      MKL_NUM_THREADS: '4'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install verified CPU music runtime
        run: |
          python -m pip install --no-cache-dir torch==2.7.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install --no-cache-dir 'transformers==4.53.3' 'numpy<3' 'scipy' 'sentencepiece'
      - name: Generate and screen complete musical stingers
        run: python -u v2/audio-source/ending_lab.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: audio-ending-lab-review
          path: audio-ending-lab/
          if-no-files-found: warn
          retention-days: 7
