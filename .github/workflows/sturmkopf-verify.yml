name: STURMKOPF · build and test

on:
  push:
    branches:
      - 'garasjegym-2.0-sturm­kopf'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: WOD order tests and Vite build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: v2
    steps:
      - name: Check out STURMKOPF
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Check SQL migrations
        run: npm run check:migrations
      - name: Test app base URL and auth redirects
        run: npm run test:app-base-url
      - name: Test infotainment calendar grouping
        run: npm run test:infotainment
      - name: Test built-in WOD complex exercises
        run: npm run test:wod-complexes
      - name: Test WOD ordering
        run: npm run test:wod-order
      - name: Test WOD text import parser
        run: npm run test:wod-import
      - name: Test WOD engine normalization and scoring
        run: npm run test:wod-engine
      - name: Build application
        run: npm run build
