name: STURMKOPF · build and test

on:
  push:
    branches:
      - 'garasjegym-2.0-sturm­kopf'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: WOD order tests, dependency resolution and Vite build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: v2
    steps:
      - name: Check out STURMKOPF
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Install audio rendering dependency
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi
          ffmpeg -version
      - name: Check SQL migrations
        run: npm run check:migrations
      - name: Ensure active migration directory contains no TEST-only baseline or seed
        run: npm run check:production-migrations
      - name: Test training launch context and assignment routing
        run: npm run test:training-launch-context
      - name: Test app base URL and auth redirects
        run: npm run test:app-base-url
      - name: Test infotainment calendar grouping
        run: npm run test:infotainment
      - name: Test built-in WOD complex exercises
        run: npm run test:wod-complexes
      - name: Test WOD ordering
        run: npm run test:wod-order
      - name: Test exercise height and load measurements
        run: npm run test:exercise-measurements
      - name: Test WOD text import parser
        run: npm run test:wod-import
      - name: Test multi-part import with A–E and RIR
        run: npm run test:wod-import-structured
      - name: Test all composite stages, transitions, logging and PRs
        run: npm run test:composite-wod
      - name: Test infotainment, dashboard and Android PWA icon
        run: npm run test:infotainment-home-pwa
      - name: Test WOD engine normalization and scoring
        run: npm run test:wod-engine
      - name: Test timer clock, split and finish calculations
        run: npm run test:timer-clock
      - name: Test group class live timer phases
        run: npm run test:group-class-live-timer
      - name: Test Spotify playback device compatibility
        run: npm run test:spotify-devices
      - name: Test mobile swipe gesture classification
        run: npm run test:gestures
      - name: Test Bluetooth heart-rate measurement parsing
        run: npm run test:heart-rate
      - name: Build application
        env:
          VITE_SUPABASE_URL: https://izwzwvlexqxqewzijhhd.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_jZyaYhD8_jZgpgutKF7lRg_EcJ0EGSQ
        run: npm run build
      - name: Check built release artifact environment and secrets
        working-directory: v2
        run: npm run check:release-artifact
