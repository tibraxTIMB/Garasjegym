name: SturmKopf CI

on:
  push:
    paths:
      - 'v2/**'
      - 'scripts/**'
      - '.github/workflows/sturm-kopf-ci.yml'
  pull_request:
    paths:
      - 'v2/**'
      - 'scripts/**'
      - '.github/workflows/sturm-kopf-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sturm-kopf-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app-validation:
    name: App tests and production build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: v2
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Run automated tests
        run: npm test
      - name: Validate SQL migration syntax conventions
        run: npm run check:migrations
      - name: Build isolated TEST bundle
        env:
          VITE_SUPABASE_URL: https://izwzwvlexqxqewzijhhd.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_jZyaYhD8_jZgpgutKF7lRg_EcJ0EGSQ
          VITE_SPOTIFY_CLIENT_ID: ${{ vars.VITE_SPOTIFY_CLIENT_ID }}
        run: npm run build
      - name: Check release artifact environment and secrets
        run: npm run check:release-artifact

  production-migration-safety:
    name: Production migration safety gate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: v2
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Block test-only migrations from production path
        run: npm run check:production-migrations
