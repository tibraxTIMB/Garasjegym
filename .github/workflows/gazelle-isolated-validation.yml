name: Gazelle isolated validation
on:
  push:
    branches: [gazelle-operational-anatomical]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: gazelle-isolated-validation
  cancel-in-progress: true
jobs:
  validate:
    if: github.ref == 'refs/heads/gazelle-operational-anatomical'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: v2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: v2/package-lock.json
      - run: npm ci
      - name: Install audio build dependency
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi
          ffmpeg -version
      - name: Regression suite
        run: npm test
      - name: Production compilation without live credentials
        if: success() || failure()
        run: npm run build
