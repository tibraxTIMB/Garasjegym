name: STURMKOPF · production-target release candidate (build only)

on:
  push:
    branches:
      - "garasjegym-2.0-sturm­kopf"
      - "gazelle-alternative-audio"
      - "gazelle-flow-compact"
      - "gazelle-pt-flow-integration"
      - "gazelle-introkurs-integrity"
      - "gazelle-responsive-audit"
    paths:
      - "v2/**"
      - ".github/workflows/sturmkopf-production-candidate.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  production-candidate:
    name: Build and verify against the designated new STURMKOPF database
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: v2
    steps:
      - name: Checkout STURMKOPF
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Install audio rendering dependency
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi
          ffmpeg -version
      - name: Render optional generative audio pack
        working-directory: ${{ github.workspace }}
        run: |
          python3 -m venv "$RUNNER_TEMP/gg-audio-venv"
          "$RUNNER_TEMP/gg-audio-venv/bin/python" -m pip install --disable-pip-version-check numpy==2.3.5 scipy==1.17.0
          "$RUNNER_TEMP/gg-audio-venv/bin/python" v2/scripts/render-generative-audio.py
      - name: Check SQL migration syntax
        run: npm run check:migrations
      - name: Block TEST-only migrations from the production path
        run: npm run check:production-migrations
      - name: Run application regression suite
        run: npm test
      - name: Build production-target bundle (no deployment)
        env:
          # Owner-approved zero-cost cutover: the complete former TEST project
          # becomes the new live database after clean-start/admin acceptance.
          # The legacy Production project remains untouched.
          VITE_SUPABASE_URL: https://izwzwvlexqxqewzijhhd.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_jZyaYhD8_jZgpgutKF7lRg_EcJ0EGSQ
        run: npm run build
      - name: Verify production project binding and client artifact safety
        env:
          EXPECTED_SUPABASE_PROJECT_REF: izwzwvlexqxqewzijhhd
        run: npm run check:release-artifact
      - name: Upload production-target candidate artifact
        uses: actions/upload-artifact@v4
        with:
          name: sturmkopf-feuer-1.1-production-target-candidate
          path: v2/dist
          if-no-files-found: error
          retention-days: 14

# This workflow intentionally builds and tests only. It does not deploy to
# GitHub Pages, modify Production database schema/data, or deploy Edge Functions.
# The owner waived backup and authorized the existing complete TEST project as
# the new zero-cost live target. Rollout remains blocked until clean-start data,
# a newly created owner-admin login, and schema/RLS acceptance gates pass.
