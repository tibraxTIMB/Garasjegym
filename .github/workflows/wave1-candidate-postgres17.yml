name: Wave 1 candidate · PostgreSQL 17 sandbox

on:
  push:
    branches:
      - 'garasjegym-2.0-sturm­kopf'
    paths:
      - 'v2/supabase/candidates/wave1_membership_auth_production_candidate.sql'
      - 'v2/supabase/preflight/wave1_candidate_postgres17_*.sql'
      - '.github/workflows/wave1-candidate-postgres17.yml'

permissions:
  contents: read

jobs:
  rehearsal:
    name: Disposable PostgreSQL 17 Wave 1 candidate rehearsal
    runs-on: ubuntu-latest
    timeout-minutes: 8
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: sturmkopf
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d sturmkopf"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - name: Check out STURMKOPF
        uses: actions/checkout@v4
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client
      - name: Create disposable production-shaped fixture
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/sturmkopf
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f v2/supabase/preflight/wave1_candidate_postgres17_fixture.sql
      - name: Apply Wave 1 candidate and run authorization assertions
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/sturmkopf
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f v2/supabase/preflight/wave1_candidate_postgres17_run.sql
